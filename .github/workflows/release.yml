name: Release
# Tag v* (ex. v1.2.0) -> compile, puis publie une Release GitHub avec les binaires et le changelog.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique et tags complets : changelog depuis le tag précédent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio esptool==4.8.1
      - name: Version = tag sans le "v"
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: pio run
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION='"${{ env.VERSION }}"'
      # Mise à jour : boot_app0 (remet le démarrage sur app0, même après une mise à jour OTA qui démarre sur app1)
      # + application, à 0xe000 comme le web flasher ; la NVS (0x9000-0xe000, réglages) n'est pas touchée.
      # L'image complète depuis 0x0 remplit ce trou de 0xFF : elle efface les réglages (installation neuve).
      - name: Binaires (mise à jour à 0xe000 + image complète pour 0x0)
        run: |
          mkdir dist
          for E in m5dial android windows; do
            B=.pio/build/$E
            N=m5dial-music-$([ $E = m5dial ] && echo iphone || echo $E)-$GITHUB_REF_NAME
            esptool.py --chip esp32s3 merge_bin -o "dist/$N-update-0xe000.bin" --target-offset 0xe000 --flash_mode keep \
              0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 $B/firmware.bin
            esptool.py --chip esp32s3 merge_bin -o "dist/$N-full-0x0.bin" \
              --flash_mode keep --flash_size 8MB \
              0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
              0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 $B/firmware.bin
          done
      - name: Changelog (commits depuis le tag précédent)
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes${PREV:+ since $PREV}"
            echo
            git log --no-merges --pretty='- %s' ${PREV:+$PREV..}"$GITHUB_REF_NAME"
            echo
            echo "## Install"
            echo
            echo "- Easiest: https://poppnn.github.io/m5dial-music/ (Chrome or Edge, M5Dial over USB-C), then pick iPhone, Android or Windows."
            echo "- One firmware per platform: iphone (AMS, ANCS), android (Gadgetbridge), windows (PC app in tools/windows)."
            echo "- \`*-full-0x0.bin\`: full image, flash at address 0x0 (esptool, Espressif web flasher). **Erases settings and paired devices.**"
            echo "- \`*-update-0xe000.bin\`: update of an already installed M5Dial, flash at 0xe000: keeps settings, and boots the new firmware even after an over-the-air update."
          } > CHANGELOG.md
          cat CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          name: M5Dial Music ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*.bin
