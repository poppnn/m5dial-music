name: Build & deploy web flasher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historique complet : la version = nombre de commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio esptool==4.8.1
      - name: Version (manifeste du flasheur + firmware) = dernier tag v* (+ commits depuis), sinon 1.<nombre de commits>.0
        run: |
          V=$(git describe --tags --match 'v*' 2>/dev/null | sed 's/^v//')
          [ -n "$V" ] || V="1.$(git rev-list --count HEAD).0"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          for M in docs/manifest*.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" "$M"
            grep -q "\"version\": \"$V\"" "$M"
          done
      - run: pio run  # les 3 firmwares : m5dial (iPhone), android, windows
        env:
          PLATFORMIO_BUILD_FLAGS: -DFW_VERSION='"${{ env.VERSION }}"'
      # Deux morceaux, PAS une seule image depuis 0x0 : elle remplissait de 0xFF le trou 0x9000-0xe000, c.-à-d. la NVS
      # (réglages, appareils appairés), effacée à chaque mise à jour. Démarrage (commun aux 3) à 0x0, puis par
      # firmware otadata + application à 0xe000 ; la NVS entre les deux n'est jamais écrite.
      - name: Images for the web flasher (NVS 0x9000-0xe000 left untouched)
        run: |
          B=.pio/build/m5dial
          esptool.py --chip esp32s3 merge_bin -o docs/m5dial-boot.bin --flash_mode keep --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin
          [ $(stat -c %s docs/m5dial-boot.bin) -le $((0x9000)) ]  # ne déborde pas sur la NVS
          for E in m5dial android windows; do
            B=.pio/build/$E
            OUT=docs/m5dial-music$([ $E = m5dial ] || echo "-$E").bin
            esptool.py --chip esp32s3 merge_bin -o "$OUT" --target-offset 0xe000 --flash_mode keep \
              0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 $B/firmware.bin
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
