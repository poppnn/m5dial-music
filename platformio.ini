; M5Dial (ESP32-S3 / StampS3) - télécommande multimédia BLE : iPhone (AMS), Android et Windows (HID)
[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv  ; 8 Mo : app 3 Mo + "bootanim" (image de démarrage)
lib_deps =
    m5stack/M5Unified@^0.2.2
    m5stack/M5Dial@^1.0.3
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
