; M5Dial (ESP32-S3 / StampS3) - télécommande multimédia BLE. Un firmware par plateforme (choix dans le flasheur web) :
; m5dial = iPhone (AMS, notifications ANCS), android = HID + Gadgetbridge, windows = HID + programme PC (tools/windows).
[env]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv  ; 8 Mo : 2 x app 3 Mo (OTA) + "bootanim" (image de démarrage)
; Versions exactes, celles essayées sur le M5Dial : le CI compile le firmware envoyé par la mise à jour OTA, il ne
; doit pas prendre une version plus récente jamais testée (M5GFX figé aussi : M5Unified l'accepte en ">=").
lib_deps =
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.3.0
    m5stack/M5Dial@1.0.3
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

[env:m5dial]

[env:android]
build_flags = ${env.build_flags} -DTARGET_ANDROID

[env:windows]
build_flags = ${env.build_flags} -DTARGET_WINDOWS
